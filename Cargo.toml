[workspace]
members = [
    # Core library
    "gymnasium",
    # CLI tool
    "gymnasium_cli",
    # # Python module
    # "gymnasium_py",
    # Rust FFI bindings
    "gymnasium_sys",
]
resolver = "2"

[workspace.package]
authors = ["Andrej Orsula <orsula.andrej@gmail.com>"]
categories = ["api-bindings", "science"]
description = "Gymnasium API for Reinforcement Learning"
edition = "2021"
keywords = ["gym", "ml", "rl"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AndrejOrsula/gymnasium_rs"
rust-version = "1.74"
version = "0.0.1"

[workspace.dependencies]
gymnasium = { path = "gymnasium", version = "0.0.1" }
gymnasium_sys = { path = "gymnasium_sys", version = "0.0.1" }

clap = { version = "4.5", features = ["derive"] }
itertools = { version = "0.12" }
num-traits = { version = "0.2" }
pyo3 = { version = "0.21", features = ["abi3-py310", "auto-initialize"] }
pyo3_bindgen = { version = "0.4" }
rand = { version = "0.8", features = ["small_rng"] }
thiserror = { version = "1.0" }

candle-core = { version = "0.4" }
dfdx = { version = "0.13" }
ndarray = { version = "0.15" }
numpy = { version = "0.21" }

# assert_cmd = { version = "2" }
# predicates = { version = "3" }
# rustc-hash = { version = "1" }

# burn = { version = "0.13" }

[patch.crates-io]
pyo3_bindgen = { git = "https://github.com/AndrejOrsula/pyo3_bindgen", branch = "dev" }
